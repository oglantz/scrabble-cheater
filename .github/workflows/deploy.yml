name: deploy-ec2
on:
  push:
    branches: [ main ]
permissions:
  id-token: write   # if you use OIDC role assumption (recommended)
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Configure AWS creds – either via OIDC/role or static keys in secrets
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}   # or use access keys inputs

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push images (explicit registry)
        env:
          REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
            | docker login --username AWS --password-stdin $REGISTRY
          docker build -t $REGISTRY/scrabble-backend:${{ github.sha }} ./backend
          docker push  $REGISTRY/scrabble-backend:${{ github.sha }}
          docker build -t $REGISTRY/scrabble-frontend:${{ github.sha }} ./frontend
          docker push  $REGISTRY/scrabble-frontend:${{ github.sha }}


      - name: Rolling update via SSM
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceids,Values=${{ secrets.EC2_INSTANCE_ID }}" \
            --parameters 'commands=["cd /opt/app",
                                    "aws ecr get-login-password --region us-west-2 | docker login --username AWS --password-stdin '"${{ ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com }}"'",
                                    "sed -i \"s#:latest#:'"${{ github.sha }}"'#g\" docker-compose.yml",
                                    "docker compose pull",
                                    "docker compose up -d"]' \
            --comment "Deploy $GITHUB_SHA"
